    <text x="250" y="326" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="10" letter-spacing="1">ENERGÍA EXPLOSIVA Y ENFOQUE</text>
    <text x="250" y="364" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="12" letter-spacing="1">FRUIT PUNCH • 30 SERVICIOS</text>
    <rect x="162" y="156" width="16" height="250" rx="8" fill="#FFFFFF" opacity="0.1"/>
