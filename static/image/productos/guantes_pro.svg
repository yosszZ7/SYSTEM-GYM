<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAcc" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="beltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="shadow9" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgAcc)"/>
  <ellipse cx="250" cy="430" rx="140" ry="16" fill="#0F172A" opacity="0.11"/>
  <g filter="url(#shadow9)">
    <!-- Kit Card / Box for Lifting Straps & Gloves -->
    <rect x="110" y="130" width="280" height="250" rx="24" fill="url(#beltGrad)" stroke="#3F3F46" stroke-width="2"/>
    <rect x="110" y="130" width="280" height="12" rx="6" fill="#F58220"/>
    <!-- Dumbbell Icon -->
    <g transform="translate(250, 212)" fill="#F58220">
      <rect x="-55" y="-6" width="110" height="12" rx="4"/>
      <rect x="-72" y="-26" width="18" height="52" rx="5"/>
      <rect x="-92" y="-18" width="14" height="36" rx="4"/>
      <rect x="54" y="-26" width="18" height="52" rx="5"/>
      <rect x="78" y="-18" width="14" height="36" rx="4"/>
    </g>
    <text x="250" y="278" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Impact, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5">PRO LIFTING KIT</text>
    <text x="250" y="304" text-anchor="middle" fill="#F58220" font-family="Inter, sans-serif" font-weight="800" font-size="13" letter-spacing="2">GUANTES + STRAPS DE AGARRE</text>
    <rect x="160" y="322" width="180" height="34" rx="17" fill="#27272A"/>
    <text x="250" y="344" text-anchor="middle" fill="#E4E4E7" font-family="Inter, sans-serif" font-weight="700" font-size="11.5" letter-spacing="1">SOPORTE DE MUÑECA REFORZADO</text>
  </g>
</svg>
