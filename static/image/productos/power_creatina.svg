<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgBlue" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </radialGradient>
    <linearGradient id="tubDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="85%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="powerBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="shadow2" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.17"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bgBlue)"/>
  <ellipse cx="250" cy="436" rx="125" ry="16" fill="#0F172A" opacity="0.12"/>
  <g filter="url(#shadow2)">
    <!-- Lid -->
    <rect x="160" y="96" width="180" height="34" rx="7" fill="url(#tubDark)"/>
    <rect x="160" y="120" width="180" height="6" fill="#38BDF8"/>
    <!-- Body -->
    <rect x="144" y="128" width="212" height="292" rx="22" fill="url(#tubDark)"/>
    <!-- Label -->
    <rect x="148" y="164" width="204" height="224" rx="8" fill="url(#powerBlue)"/>
    <rect x="148" y="164" width="204" height="7" fill="#FACC15"/>
    <rect x="148" y="381" width="204" height="7" fill="#FACC15"/>
    <!-- Brand -->
    <rect x="188" y="182" width="124" height="24" rx="12" fill="#FACC15"/>
    <text x="250" y="199" text-anchor="middle" fill="#0F172A" font-family="Inter, sans-serif" font-weight="900" font-size="14" letter-spacing="2.5">POWER LABS</text>
    <text x="250" y="244" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Impact, sans-serif" font-weight="900" font-size="34" letter-spacing="1">CREATINE</text>
    <text x="250" y="268" text-anchor="middle" fill="#7DD3FC" font-family="Inter, sans-serif" font-weight="800" font-size="13" letter-spacing="2.5">100% MICRONIZED</text>
    <!-- Info pill -->
    <rect x="168" y="286" width="164" height="50" rx="8" fill="#0F172A" opacity="0.88"/>
    <text x="250" y="309" text-anchor="middle" fill="#FACC15" font-family="Inter, sans-serif" font-weight="900" font-size="16">5000 mg / SERV</text>
    <text x="250" y="326" text-anchor="middle" fill="#E2E8F0" font-family="Inter, sans-serif" font-weight="700" font-size="10" letter-spacing="1">FUERZA • POTENCIA • ATP</text>
    <text x="250" y="364" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="700" font-size="12" letter-spacing="1">100 SERVICIOS • 500G</text>
    <!-- Highlight -->
    <rect x="158" y="136" width="18" height="274" rx="9" fill="#FFFFFF" opacity="0.1"/>
  </g>
</svg>
