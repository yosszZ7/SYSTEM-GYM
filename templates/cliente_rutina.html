{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <div class="page-header-left">
            <h1><i class="fas fa-dumbbell"></i> Rutinas del Cliente</h1>
            <p>Seleccione un cliente para ver sus rutinas asignadas</p>
        </div>
        <a href="/rutina_asignar" class="btn btn-primary">
            <i class="fas fa-plus-circle"></i> Asignar Rutina
        </a>
    </div>

    <div class="card" style="margin-bottom: 2rem;">
        <div class="card-body">
            <div class="search-box">
                <div class="search-input-group">
                    <select id="IdCliente" style="flex: 1; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 8px; background: var(--bg-tertiary); color: var(--text); font-size: 14px; cursor: pointer;">
                        <option value="">Seleccione un cliente...</option>
                        {% for c in clientes %}
                        <option value="{{ c.IdCliente }}">{{ c.PrimerNombre }} {{ c.PrimerApellido }}</option>
                        {% endfor %}
                    </select>
                    <button onclick="verRutinas()" class="btn btn-primary">
                        <i class="fas fa-eye"></i> Ver Rutinas
                    </button>
                </div>
                <small class="form-text" style="display: block; margin-top: 0.5rem; color: var(--text-tertiary);">
                    Seleccione un cliente y haga clic en "Ver Rutinas" o cambie la selección
                </small>
            </div>
        </div>
    </div>

    <div id="rutinas" class="results-container">
        <div class="no-results-message">
            <i class="fas fa-clipboard-list"></i>
            <p>Seleccione un cliente para ver sus rutinas</p>
        </div>
    </div>
</div>

<style>
    .search-box {
        max-width: 600px;
        margin: 0 auto;
    }
    .search-input-group {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .no-results-message {
        text-align: center;
        padding: 3rem 2rem;
        background: var(--bg-secondary);
        border-radius: 10px;
        border: 1px dashed var(--border-color);
        color: var(--text-secondary);
    }
    .no-results-message i {
        font-size: 3rem;
        color: var(--text-tertiary);
        margin-bottom: 1rem;
        display: block;
    }
    .badge-status {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    .badge-status.active {
        background: var(--success-light);
        color: var(--success);
    }
    .badge-status.inactive {
        background: var(--danger-light);
        color: var(--danger);
    }
    .badge-status.completed {
        background: var(--info-light);
        color: var(--info);
    }
    .badge-status.pending {
        background: var(--warning-light);
        color: var(--warning);
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('IdCliente').addEventListener('change', function() {
        if (this.value) {
            verRutinas();
        }
    });
});

function verRutinas() {
    let id = document.getElementById('IdCliente').value;
    
    if (!id) {
        document.getElementById('rutinas').innerHTML = `
            <div class="alert alert-warning">
                <i class="fas fa-exclamation-triangle" style="margin-right: 12px;"></i>
                <div class="alert-content">
                    <div class="alert-message">Por favor seleccione un cliente</div>
                </div>
            </div>`;
        return;
    }

    document.getElementById('rutinas').innerHTML = `
        <div class="loading-spinner" style="text-align: center; padding: 2.5rem 0;">
            <div class="spinner-border" role="status" style="width: 2.5rem; height: 2.5rem; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spinner-border .75s linear infinite; color: var(--primary);">
                <span class="sr-only">Cargando...</span>
            </div>
            <p class="text-muted mt-2" style="font-size:0.9rem; color: var(--text-secondary);">Cargando rutinas...</p>
        </div>`;

    fetch('/api/rutinas/cliente/' + id)
        .then(r => r.json())
        .then(data => {
            if (data.length === 0) {
                document.getElementById('rutinas').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle" style="margin-right: 12px;"></i>
                        <div class="alert-content">
                            <div class="alert-message">Este cliente no tiene rutinas asignadas</div>
                        </div>
                    </div>`;
                return;
            }

            let html = `
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-clipboard-list"></i> Rutinas Asignadas</h2>
                        <span class="badge badge-info">${data.length} rutina${data.length > 1 ? 's' : ''}</span>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Fecha Inicio</th>
                                        <th>Fecha Fin</th>
                                        <th>Frecuencia</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>`;

            data.forEach(r => {
                let statusClass = 'pending';
                let statusText = r.Estado || 'Pendiente';
                
                if (statusText.toLowerCase() === 'activo' || statusText.toLowerCase() === 'active') {
                    statusClass = 'active';
                } else if (statusText.toLowerCase() === 'completado' || statusText.toLowerCase() === 'completed') {
                    statusClass = 'completed';
                } else if (statusText.toLowerCase() === 'inactivo' || statusText.toLowerCase() === 'inactive') {
                    statusClass = 'inactive';
                }

                let fechaFin = r.FechaFin || '—';

                html += `
                    <tr>
                        <td>${r.IdRutinaCliente}</td>
                        <td><strong>${r.NombreRutina}</strong></td>
                        <td>${r.FechaInicio}</td>
                        <td>${fechaFin}</td>
                        <td>${r.FrecuenciaSemanal} días/sem</td>
                        <td><span class="badge-status ${statusClass}">${statusText}</span></td>
                    </tr>`;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;

            document.getElementById('rutinas').innerHTML = html;
        })
        .catch(() => {
            document.getElementById('rutinas').innerHTML = `
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle" style="margin-right: 12px;"></i>
                    <div class="alert-content">
                        <div class="alert-message">Error al cargar las rutinas. Intente nuevamente.</div>
                    </div>
                </div>`;
        });
}
</script>

{% endblock %}
