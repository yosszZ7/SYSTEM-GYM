{% extends "base.html" %}

{% block content %}
<h1>Reporte de Ingresos Mensuales</h1>

<table class="data-table">
    <thead><tr><th>Anio</th><th>Mes</th><th>TotalIngresos</th></tr></thead>
    <tbody>
        {% for ingreso in ingresos %}
        <tr><td>{{ ingreso.Anio }}</td><td>{{ ingreso.Mes }}</td><td>C${{ ingreso.TotalIngresos }}</td></tr>
        {% endfor %}
    </tbody>
</table>


{% endblock %}
