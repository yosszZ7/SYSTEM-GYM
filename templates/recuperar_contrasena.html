<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | WORLDGYM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2.0.0">
    <style>
        @view-transition {
            navigation: auto;
        }
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.22s;
            animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.login-page {
            margin: 0;
            padding: 24px;
            background: #F7F8FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #252B36;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
        }
        .login-card {
            background: #FFFFFF;
            border: 1px solid #E8EBEF;
            border-radius: 12px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.05);
            position: relative;
            overflow: hidden;
            animation: loginCardEnter 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
            transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform, opacity;
        }
        .login-card.is-exiting {
            opacity: 0;
            transform: translateY(-8px) scale(0.985);
            pointer-events: none;
        }
        .login-card.is-shaking {
            animation: loginCardShake 0.34s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        .login-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2.5px;
            width: 0%;
            background: linear-gradient(90deg, #F58220 0%, #FFA959 100%);
            opacity: 0;
            pointer-events: none;
            transition: width 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
        }
        .login-progress-bar.is-active {
            opacity: 1;
        }

        @keyframes loginCardEnter {
            from { opacity: 0; transform: translateY(14px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes loginLogoEnter {
            from { opacity: 0; transform: scale(0.92) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes loginItemEnter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes loginCardShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3.5px); }
            80% { transform: translateX(3.5px); }
        }
        @keyframes btnSpin {
            to { transform: rotate(360deg); }
        }

        .login-stagger {
            animation: loginItemEnter 0.36s cubic-bezier(0.22, 1, 0.36, 1) calc(0.05s + var(--stagger, 0) * 0.045s) both;
        }

        .login-logo img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid #E8EBEF;
            animation: loginLogoEnter 0.36s cubic-bezier(0.22, 1, 0.36, 1) 0.04s both;
        }
        .login-logo h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #252B36;
            letter-spacing: -0.02em;
        }
        .login-logo h1 span {
            color: #F58220;
        }
        .login-card h2 {
            font-size: 18px;
            color: #252B36;
            margin: 18px 0 6px 0;
            font-weight: 700;
        }
        .login-card p.subtitle {
            color: #7B8491;
            margin: 0 0 22px 0;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7B8491;
            font-size: 14px;
            transition: color 0.18s ease;
        }
        .input-wrapper:focus-within i.input-icon {
            color: #F58220;
        }
        .input-wrapper input {
            width: 100%;
            height: 42px;
            padding: 0 14px 0 40px;
            border: 1px solid #E8EBEF;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            background: #FFFFFF;
            color: #252B36;
            transition: border-color 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                        background-color 0.18s ease;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: #F58220;
            box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.14);
        }
        .input-wrapper input:disabled {
            background: #F9FAFB;
            color: #667085;
            cursor: not-allowed;
        }
        .btn-submit {
            width: 100%;
            height: 42px;
            padding: 0 16px;
            background: #F58220;
            color: #FFFFFF;
            border: 1px solid #F58220;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.18s ease,
                        border-color 0.18s ease,
                        transform 0.16s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover:not(:disabled) {
            background: #DC6E12;
            border-color: #DC6E12;
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(245, 130, 32, 0.22);
        }
        .btn-submit:active:not(:disabled) {
            transform: translateY(0) scale(0.988);
        }
        .btn-submit:disabled {
            cursor: default;
        }
        .btn-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: btnSpin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .message-collapse {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            margin-top: 0;
            transition: grid-template-rows 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.22s ease,
                        margin-top 0.26s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .message-collapse.is-open {
            grid-template-rows: 1fr;
            opacity: 1;
            margin-top: 18px;
        }
        .message-collapse-inner {
            overflow: hidden;
        }
        .message-box {
            margin-top: 0;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            line-height: 1.45;
            text-align: left;
        }
        .message-box.error {
            background: #FEF3F2;
            color: #F04438;
            border: 1px solid rgba(240, 68, 56, 0.25);
            display: block;
        }
        .message-box.success {
            background: #ECFDF3;
            color: #12B76A;
            border: 1px solid rgba(18, 183, 106, 0.25);
            display: block;
        }
        .back-link-container {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #E8EBEF;
        }
        .back-link {
            color: #7B8491;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.16s ease, transform 0.16s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .back-link:hover {
            color: #F58220;
            transform: translateX(-2px);
        }
        .preview-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 14px;
            background: #12B76A;
            color: #FFFFFF !important;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
        }
        .loader-overlay {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card" id="recoveryCard">
            <div class="login-progress-bar" id="recoveryProgressBar" aria-hidden="true"></div>
            <div class="login-logo">
                <img src="/static/image/logo.jpeg" alt="WORLDGYM Logo">
                <h1 class="login-stagger" style="--stagger: 1;">WORLD<span>GYM</span></h1>
            </div>

            <div class="login-stagger" style="--stagger: 2;">
                <h2>¿Olvidaste tu contraseña?</h2>
                <p class="subtitle">
                    Ingresa tu correo electrónico o nombre de usuario registrado para recibir un enlace seguro de recuperación.
                </p>
            </div>

            <form id="formRecuperar" novalidate>
                <div class="input-wrapper login-stagger" style="--stagger: 3;">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="text" id="datoUsuario" placeholder="Correo o nombre de usuario" required autocomplete="off" autofocus>
                </div>
                <div class="login-stagger" style="--stagger: 4;">
                    <button type="submit" id="btnEnviar" class="btn-submit">
                        <i class="fas fa-paper-plane"></i> Enviar Enlace de Recuperación
                    </button>
                </div>
            </form>

            <div id="messageWrap" class="message-collapse" aria-live="polite">
                <div class="message-collapse-inner">
                    <div id="messageBox" class="message-box"></div>
                </div>
            </div>

            <div class="back-link-container login-stagger" style="--stagger: 5;">
                <a href="/login" id="backToLoginLink" class="back-link">
                    <i class="fas fa-arrow-left"></i> Volver a Iniciar Sesión
                </a>
            </div>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay" aria-hidden="true"></div>

    <script>
        const card = document.getElementById('recoveryCard');
        const progressBar = document.getElementById('recoveryProgressBar');
        const form = document.getElementById('formRecuperar');
        const btn = document.getElementById('btnEnviar');
        const messageWrap = document.getElementById('messageWrap');
        const messageBox = document.getElementById('messageBox');
        const inputDato = document.getElementById('datoUsuario');
        const backToLoginLink = document.getElementById('backToLoginLink');
        const defaultBtnHtml = '<i class="fas fa-paper-plane"></i> Enviar Enlace de Recuperación';

        function triggerShake() {
            card.classList.remove('is-shaking');
            void card.offsetWidth;
            card.classList.add('is-shaking');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const valor = inputDato.value.trim();
            if (!valor) {
                triggerShake();
                mostrarMensaje('Por favor, ingresa tu correo o usuario.', 'error');
                inputDato.focus();
                return;
            }

            messageWrap.classList.remove('is-open');
            inputDato.disabled = true;
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span><span>Verificando cuenta...</span>';
            progressBar.classList.add('is-active');
            progressBar.style.width = '72%';

            try {
                const response = await fetch('/api/recuperar-contrasena', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dato: valor })
                });

                const data = await response.json();

                if (data.success) {
                    progressBar.style.width = '100%';
                    let htmlContent = `<strong><i class="fas fa-check-circle"></i> ¡Instrucciones enviadas!</strong><br>${data.mensaje}`;
                    if (data.preview_url) {
                        htmlContent += `<br><div style="margin-top: 10px;"><a href="${data.preview_url}" target="_blank" class="preview-btn"><i class="fas fa-envelope-open-text"></i> Abrir Correo Generado</a></div>`;
                    }
                    messageBox.innerHTML = htmlContent;
                    messageBox.className = 'message-box success';
                    messageWrap.classList.add('is-open');
                    inputDato.value = '';
                } else {
                    triggerShake();
                    mostrarMensaje(data.error || 'No se pudo procesar la solicitud.', 'error');
                }
            } catch (err) {
                console.error(err);
                triggerShake();
                mostrarMensaje('Error de conexión con el servidor. Intenta de nuevo.', 'error');
            } finally {
                setTimeout(function() {
                    progressBar.classList.remove('is-active');
                    progressBar.style.width = '0%';
                }, 300);
                inputDato.disabled = false;
                btn.disabled = false;
                btn.innerHTML = defaultBtnHtml;
            }
        });

        function mostrarMensaje(texto, tipo) {
            messageBox.innerHTML = `<strong><i class="fas fa-exclamation-circle"></i></strong> ${texto}`;
            messageBox.className = 'message-box ' + tipo;
            messageWrap.classList.add('is-open');
        }

        if (backToLoginLink) {
            backToLoginLink.addEventListener('click', function(e) {
                if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
                const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reducedMotion) return;
                e.preventDefault();
                const href = backToLoginLink.getAttribute('href');
                card.classList.add('is-exiting');
                setTimeout(function() {
                    window.location.href = href;
                }, 180);
            });
        }

        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                card.classList.remove('is-exiting', 'is-shaking');
            }
        });
    </script>
</body>
</html>
