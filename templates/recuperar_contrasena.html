<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | WORLDGYM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2.0.0">
    <style>
        body.login-page {
            margin: 0;
            padding: 24px;
            background: #F7F8FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #252B36;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
        }
        .login-card {
            background: #FFFFFF;
            border: 1px solid #E8EBEF;
            border-radius: 12px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.05);
        }
        .login-logo img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid #E8EBEF;
        }
        .login-logo h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #252B36;
            letter-spacing: -0.02em;
        }
        .login-logo h1 span {
            color: #F58220;
        }
        .login-card h2 {
            font-size: 18px;
            color: #252B36;
            margin: 18px 0 6px 0;
            font-weight: 700;
        }
        .login-card p.subtitle {
            color: #7B8491;
            margin: 0 0 22px 0;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }
        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7B8491;
            font-size: 14px;
        }
        .input-wrapper input {
            width: 100%;
            height: 42px;
            padding: 0 14px 0 40px;
            border: 1px solid #E8EBEF;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            background: #FFFFFF;
            color: #252B36;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: #F58220;
            box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.14);
        }
        .btn-submit {
            width: 100%;
            height: 42px;
            padding: 0 16px;
            background: #F58220;
            color: #FFFFFF;
            border: 1px solid #F58220;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: #DC6E12;
            border-color: #DC6E12;
        }
        .message-box {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            line-height: 1.45;
            text-align: left;
        }
        .message-box.error {
            background: #FEF3F2;
            color: #F04438;
            border: 1px solid rgba(240, 68, 56, 0.25);
            display: block;
        }
        .message-box.success {
            background: #ECFDF3;
            color: #12B76A;
            border: 1px solid rgba(18, 183, 106, 0.25);
            display: block;
        }
        .back-link-container {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #E8EBEF;
        }
        .back-link {
            color: #7B8491;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s ease;
        }
        .back-link:hover {
            color: #F58220;
        }
        .preview-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 14px;
            background: #12B76A;
            color: #FFFFFF !important;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 600;
            text-decoration: none;
        }
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(247, 248, 250, 0.85);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #E8EBEF;
            border-top: 3px solid #F58220;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            color: #252B36;
            margin-top: 12px;
            font-weight: 500;
            font-size: 13.5px;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="/static/image/logo.jpeg" alt="WORLDGYM Logo">
                <h1>WORLD<span>GYM</span></h1>
            </div>

            <h2>¿Olvidaste tu contraseña?</h2>
            <p class="subtitle">
                Ingresa tu correo electrónico o nombre de usuario registrado para recibir un enlace seguro de recuperación.
            </p>

            <form id="formRecuperar">
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="text" id="datoUsuario" placeholder="Correo o nombre de usuario" required autocomplete="off" autofocus>
                </div>
                <button type="submit" id="btnEnviar" class="btn-submit">
                    <i class="fas fa-paper-plane"></i> Enviar Enlace de Recuperación
                </button>
            </form>

            <div id="messageBox" class="message-box"></div>

            <div class="back-link-container">
                <a href="/login" class="back-link">
                    <i class="fas fa-arrow-left"></i> Volver a Iniciar Sesión
                </a>
            </div>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader"></div>
        <div class="loader-text" id="loaderText">Verificando cuenta y enviando correo...</div>
    </div>

    <script>
        const form = document.getElementById('formRecuperar');
        const btn = document.getElementById('btnEnviar');
        const loader = document.getElementById('loaderOverlay');
        const messageBox = document.getElementById('messageBox');
        const inputDato = document.getElementById('datoUsuario');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const valor = inputDato.value.trim();
            if (!valor) {
                mostrarMensaje('Por favor, ingresa tu correo o usuario.', 'error');
                return;
            }

            loader.style.display = 'flex';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const response = await fetch('/api/recuperar-contrasena', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dato: valor })
                });

                const data = await response.json();

                if (data.success) {
                    let htmlContent = `<strong><i class="fas fa-check-circle"></i> ¡Instrucciones enviadas!</strong><br>${data.mensaje}`;
                    if (data.preview_url) {
                        htmlContent += `<br><div style="margin-top: 10px;"><a href="${data.preview_url}" target="_blank" class="preview-btn"><i class="fas fa-envelope-open-text"></i> Abrir Correo Generado</a></div>`;
                    }
                    messageBox.innerHTML = htmlContent;
                    messageBox.className = 'message-box success';
                    messageBox.style.display = 'block';
                    inputDato.value = '';
                } else {
                    mostrarMensaje(data.error || 'No se pudo procesar la solicitud.', 'error');
                }
            } catch (err) {
                console.error(err);
                mostrarMensaje('Error de conexión con el servidor. Intenta de nuevo.', 'error');
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });

        function mostrarMensaje(texto, tipo) {
            messageBox.innerHTML = `<strong><i class="fas fa-exclamation-circle"></i></strong> ${texto}`;
            messageBox.className = 'message-box ' + tipo;
            messageBox.style.display = 'block';
        }
    </script>
</body>
</html>
