<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WORLD GYM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Asegurar que el login se vea bien */
        body.login-page {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #c2c7ea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 20px;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .login-logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .login-logo h1 {
            font-size: 28px;
            margin: 0;
            color: #1a1a2e;
        }
        .login-logo h1 span {
            color: #2563EB;
        }
        .login-logo p {
            color: #666;
            margin-top: 5px;
        }
        .login-form input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .login-form button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-form button:hover {
            transform: translateY(-2px);
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.error {
            background: #FEE2E2;
            color: #DC2626;
            display: block;
        }
        .message.success {
            background: #D1FAE5;
            color: #065F46;
            display: block;
        }
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            color: white;
            margin-top: 15px;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="/static/image/logo.jpeg" alt="World Gym Logo">
                <h1>WORLD <span>GYM</span></h1>
                <p>Sistema de Gestión Fitness</p>
            </div>
            <form id="loginForm" class="login-form">
                <input type="text" id="NombreUsuario" placeholder="Usuario" required autocomplete="off">
                <input type="password" id="Contrasena" placeholder="Contraseña" required>
                <button type="submit" id="loginBtn">Iniciar Sesión</button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader"></div>
        <div class="loader-text">Iniciando sesión...</div>
    </div>

    <script>
        // Login JavaScript
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('NombreUsuario').value.trim();
            const password = document.getElementById('Contrasena').value.trim();
            
            if (!usuario || !password) {
                mostrarMensaje('Complete todos los campos', 'error');
                return;
            }
            
            // Mostrar loader
            loaderOverlay.style.display = 'flex';
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ NombreUsuario: usuario, Contrasena: password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Guardar usuario en localStorage
                    localStorage.setItem('user', JSON.stringify(data.usuario));
                    mostrarMensaje('Inicio exitoso, redirigiendo...', 'success');
                    
                    setTimeout(function() {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    mostrarMensaje(data.error || 'Credenciales incorrectas', 'error');
                    loaderOverlay.style.display = 'none';
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = '1';
                    document.getElementById('Contrasena').value = '';
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
                loaderOverlay.style.display = 'none';
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
            }
        });
        
        function mostrarMensaje(mensaje, tipo) {
            messageDiv.textContent = mensaje;
            messageDiv.className = 'message ' + tipo;
            messageDiv.style.display = 'block';
            
            setTimeout(function() {
                messageDiv.style.display = 'none';
            }, 4000);
        }
        
        // Enter key submit
        document.getElementById('Contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
