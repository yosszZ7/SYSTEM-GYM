<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | WORLDGYM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2.0.0">
    <style>
        body.login-page {
            margin: 0;
            padding: 24px;
            background: #F7F8FA;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #252B36;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
        }
        .login-card {
            background: #FFFFFF;
            border: 1px solid #E8EBEF;
            border-radius: 12px;
            padding: 36px 32px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.05);
        }
        .login-logo {
            margin-bottom: 24px;
        }
        .login-logo img {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 12px;
            border: 1px solid #E8EBEF;
        }
        .login-logo h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #252B36;
            letter-spacing: -0.02em;
        }
        .login-logo h1 span {
            color: #F58220;
        }
        .login-logo p {
            color: #7B8491;
            margin-top: 4px;
            font-size: 13.5px;
        }
        .login-form {
            text-align: left;
        }
        .login-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #252B36;
            margin-bottom: 6px;
        }
        .login-form input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            margin-bottom: 16px;
            border: 1px solid #E8EBEF;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            background: #FFFFFF;
            color: #252B36;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .login-form input::placeholder {
            color: #98A2B3;
        }
        .login-form input:focus {
            outline: none;
            border-color: #F58220;
            box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.14);
        }
        .login-form button[type="submit"] {
            width: 100%;
            height: 42px;
            padding: 0 16px;
            background: #F58220;
            color: #FFFFFF;
            border: 1px solid #F58220;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 4px;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        .login-form button[type="submit"]:hover {
            background: #DC6E12;
            border-color: #DC6E12;
        }
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
        }
        .password-wrapper input {
            margin: 0 !important;
            padding-right: 44px !important;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #7B8491;
            cursor: pointer;
            padding: 4px;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
            z-index: 2;
        }
        .toggle-password:hover {
            color: #F58220;
        }
        .message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
        }
        .message.error {
            background: #FEF3F2;
            color: #F04438;
            display: block;
            border: 1px solid rgba(240, 68, 56, 0.25);
        }
        .message.success {
            background: #ECFDF3;
            color: #12B76A;
            display: block;
            border: 1px solid rgba(18, 183, 106, 0.25);
        }
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(247, 248, 250, 0.85);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid #E8EBEF;
            border-top: 3px solid #F58220;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-text {
            color: #252B36;
            margin-top: 12px;
            font-size: 13.5px;
            font-weight: 500;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="/static/image/logo.jpeg" alt="WORLDGYM Logo">
                <h1>WORLD<span>GYM</span></h1>
                <p>Sistema de Gestión para Gimnasio</p>
            </div>
            <form id="loginForm" class="login-form">
                <label class="login-label" for="NombreUsuario">Usuario</label>
                <input type="text" id="NombreUsuario" placeholder="Ingresa tu usuario" required autocomplete="off">

                <label class="login-label" for="Contrasena">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="Contrasena" placeholder="Ingresa tu contraseña" required>
                    <button type="button" id="togglePasswordBtn" class="toggle-password" title="Mostrar contraseña" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
                <div style="display: flex; justify-content: flex-end; margin: 4px 0 16px 0;">
                    <a href="/recuperar_contrasena" style="color: #F58220; font-size: 12.5px; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 5px;">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
                <button type="submit" id="loginBtn">Iniciar Sesión</button>
            </form>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="message {{ 'success' if category == 'success' else 'error' }}" style="display: block; margin-top: 16px;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <div id="message" class="message"></div>
        </div>
    </div>

    <div id="loaderOverlay" class="loader-overlay">
        <div class="loader"></div>
        <div class="loader-text">Iniciando sesión...</div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loaderOverlay = document.getElementById('loaderOverlay');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('NombreUsuario').value.trim();
            const password = document.getElementById('Contrasena').value.trim();
            
            if (!usuario || !password) {
                mostrarMensaje('Complete todos los campos', 'error');
                return;
            }
            
            loaderOverlay.style.display = 'flex';
            loginBtn.disabled = true;
            loginBtn.style.opacity = '0.7';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ NombreUsuario: usuario, Contrasena: password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.usuario));
                    mostrarMensaje('Inicio exitoso, redirigiendo...', 'success');
                    
                    setTimeout(function() {
                        window.location.href = data.redirect_url || (data.usuario && String(data.usuario.rol || '').toLowerCase() === 'cliente' ? '/tienda' : '/dashboard');
                    }, 800);
                } else {
                    mostrarMensaje(data.error || 'Credenciales incorrectas', 'error');
                    loaderOverlay.style.display = 'none';
                    loginBtn.disabled = false;
                    loginBtn.style.opacity = '1';
                    document.getElementById('Contrasena').value = '';
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
                loaderOverlay.style.display = 'none';
                loginBtn.disabled = false;
                loginBtn.style.opacity = '1';
            }
        });
        
        function mostrarMensaje(mensaje, tipo) {
            messageDiv.textContent = mensaje;
            messageDiv.className = 'message ' + tipo;
            messageDiv.style.display = 'block';
            
            setTimeout(function() {
                messageDiv.style.display = 'none';
            }, 4000);
        }
        
        document.getElementById('Contrasena').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const contrasenaInput = document.getElementById('Contrasena');
        const togglePasswordIcon = document.getElementById('togglePasswordIcon');

        if (togglePasswordBtn && contrasenaInput && togglePasswordIcon) {
            togglePasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (contrasenaInput.type === 'password') {
                    contrasenaInput.type = 'text';
                    togglePasswordIcon.classList.remove('fa-eye');
                    togglePasswordIcon.classList.add('fa-eye-slash');
                    togglePasswordBtn.setAttribute('title', 'Ocultar contraseña');
                    togglePasswordBtn.setAttribute('aria-label', 'Ocultar contraseña');
                } else {
                    contrasenaInput.type = 'password';
                    togglePasswordIcon.classList.remove('fa-eye-slash');
                    togglePasswordIcon.classList.add('fa-eye');
                    togglePasswordBtn.setAttribute('title', 'Mostrar contraseña');
                    togglePasswordBtn.setAttribute('aria-label', 'Mostrar contraseña');
                }
                contrasenaInput.focus();
            });
        }
    </script>
</body>
</html>
